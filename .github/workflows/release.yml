name: Release

# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux
# whenever a `v*` tag is pushed, then attaches them to a GitHub Release
# draft. Publish the draft release from the GitHub UI when ready.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "ZenTube v__VERSION__"
          releaseBody: |
            Installers are attached below.

            - **Windows**: `.exe` (NSIS installer) or `.msi`
            - **macOS**: `.dmg` — pick `aarch64` (Apple Silicon) or `x64` (Intel)
            - **Linux**: `.AppImage`, `.deb` or `.rpm`

            > macOS may warn that the app is unsigned on first launch —
            right-click the app and choose *Open*, or allow it in
            *System Settings → Privacy & Security*.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
