<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pacato Update</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #22356B 0%, #16224A 55%, #0E1730 100%);
      color: #F5F8FF;
      height: 100vh;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(95, 224, 200, 0.38);
    }
    .logo { width: 36px; height: 36px; flex-shrink: 0; }
    .text { flex: 1; min-width: 0; }
    .title { font-size: 13px; font-weight: 600; color: #FFFFFF; }
    .subtitle { font-size: 12px; color: #AEB8CF; margin-top: 2px; }
    .status { font-size: 11px; color: #5FE0C8; margin-top: 3px; min-height: 14px; }
    button {
      border: none;
      border-radius: 18px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    #install { background: linear-gradient(135deg, #3EC9B0, #2A9DB5); color: #FFFFFF; }
    #install:hover { background: linear-gradient(135deg, #35B8A0, #217E9E); }
    #install:disabled { opacity: 0.6; cursor: default; }
    #later { background: transparent; color: #AEB8CF; }
    #later:hover { color: #FFFFFF; }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3EC9B0"/>
        <stop offset="52%" stop-color="#2A9DB5"/>
        <stop offset="100%" stop-color="#26407A"/>
      </linearGradient>
      <linearGradient id="pglow" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#EAFBFF"/>
      </linearGradient>
    </defs>
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#pbg)"/>
    <path d="M205 183c0-12 13-19 23-13l126 73c10 6 10 20 0 26l-126 73c-10 6-23-1-23-13V183z" fill="url(#pglow)" transform="translate(34 46.26) scale(0.82)"/>
    <path d="M122 386q42-20 84 0t84 0t84 0" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="13" stroke-linecap="round"/>
    <path d="M122 424q42-20 84 0t84 0t84 0" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="13" stroke-linecap="round"/>
  </svg>
  <div class="text">
    <div class="title" id="ver">Update available</div>
    <div class="subtitle">A new version of Pacato is ready to install.</div>
    <div class="status" id="status"></div>
  </div>
  <button id="install">Install &amp; Relaunch</button>
  <button id="later">Not now</button>

  <script>
    const { invoke } = window.__TAURI__.core;

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const info = await invoke('get_update_info');
        if (info && info.version) {
          document.getElementById('ver').textContent =
            'Pacato ' + info.version + ' is available';
        }
      } catch (e) { /* banner still shows generic text */ }
    });

    document.getElementById('install').addEventListener('click', async (e) => {
      const btn = e.target;
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Downloading…';
      status.textContent = '';
      try {
        await invoke('install_update');
      } catch (err) {
        status.textContent = 'Error: ' + err;
        status.style.color = '#FF9E9E';
        btn.disabled = false;
        btn.textContent = 'Install & Relaunch';
      }
    });

    document.getElementById('later').addEventListener('click', () => {
      invoke('dismiss_update_banner');
    });
  </script>
</body>
</html>
