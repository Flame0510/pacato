<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacato</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #22356B 0%, #16224A 55%, #0E1730 100%);
      color: #F5F8FF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; color: #FFFFFF; letter-spacing: 0.02em; }
    .tagline { color: #5FE0C8; font-weight: 600; margin-bottom: 14px; }
    p { color: #AEB8CF; max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3EC9B0"/>
          <stop offset="52%" stop-color="#2A9DB5"/>
          <stop offset="100%" stop-color="#26407A"/>
        </linearGradient>
        <linearGradient id="pglow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#EAFBFF"/>
        </linearGradient>
      </defs>
      <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#pbg)"/>
      <path d="M205 183c0-12 13-19 23-13l126 73c10 6 10 20 0 26l-126 73c-10 6-23-1-23-13V183z" fill="url(#pglow)" transform="translate(34 46.26) scale(0.82)"/>
      <path d="M122 386q42-20 84 0t84 0t84 0" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="13" stroke-linecap="round"/>
      <path d="M122 424q42-20 84 0t84 0t84 0" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="13" stroke-linecap="round"/>
    </svg>
    <h1>Pacato</h1>
    <p class="tagline">The calm way to watch YouTube.</p>
    <p>This window normally loads youtube.com directly. If you can read this page, the main window failed to navigate &mdash; please reopen the app.</p>
  </main>
</body>
</html>
