<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #aaa; max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="#FF0000"/>
      <path d="M 189 160 L 189 352 L 359 256 Z" fill="#FFFFFF"/>
    </svg>
    <h1>ZenTube</h1>
    <p>This window normally loads youtube.com directly. If you can read this page, the main window failed to navigate &mdash; please reopen the app.</p>
  </main>
</body>
</html>
